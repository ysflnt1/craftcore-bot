name: Python checks

on:
  push:
    branches:
      - main
      - feature/craftcore-2v2-tournament
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://craftcore:craftcore@localhost:5432/craftcore
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: craftcore
          POSTGRES_PASSWORD: craftcore
          POSTGRES_DB: craftcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U craftcore -d craftcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Import bot and verify command registration
        env:
          DISCORD_TOKEN: not-used-in-smoke-test
        run: |
          python -c "import bot; assert all(bot.bot.tree.get_command(x) for x in ('bracket','draft','tournament','team','match','panels','announcement','player','prize','awards','betting')); assert bot.panel_view_factory().is_persistent()"
      - name: Install test runner
        run: pip install pytest
      - name: Run tests
        run: PYTHONPATH=. pytest -q
