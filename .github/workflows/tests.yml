name: Python checks

on:
  push:
    branches:
      - main
      - feature/craftcore-2v2-tournament
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Import bot and verify command registration
        env:
          DISCORD_TOKEN: not-used-in-smoke-test
        run: |
          python -c "import bot; assert all(bot.bot.tree.get_command(x) for x in ('bracket','draft','tournament','team','match','panels','announcement','player','prize','awards','betting')); assert bot.panel_view_factory().is_persistent()"
      - name: Install test runner
        run: pip install pytest
      - name: Run tests
        run: PYTHONPATH=. pytest -q
