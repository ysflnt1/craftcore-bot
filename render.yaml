
services:
  - type: web
    name: craftcore-bot
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn web:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: DISCORD_TOKEN
        sync: false

      - key: GUILD_ID
        sync: false

      - key: STAFF_ROLE_IDS
        sync: false

      - key: STARTING_COINS
        value: "100"

      - key: WIN_MULTIPLIER
        value: "1.5"

      - key: DB_PATH
        value: craftcore.db
